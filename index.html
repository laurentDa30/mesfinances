<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Comptes du foyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : une colonne de 720px, en-tête collant avec onglets ; chaque onglet = synthèse en haut, détail dessous */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E8EE; --ink:#141C28; --muted:#5A6576; --line:#D6DCE4;
  --accent:#2C46B1; --accent-ink:#FFFFFF; --accent-soft:#E2E7FA;
  --good:#16794A; --good-soft:#DDF2E6; --warn:#A8670E; --warn-soft:#FBEBD2; --bad:#B8322A; --bad-soft:#F8DEDA;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --sunk:#1D2532; --ink:#E6EBF2; --muted:#97A3B4; --line:#283242;
  --accent:#93A6FF; --accent-ink:#0E131A; --accent-soft:#222C4D;
  --good:#53C58E; --good-soft:#163526; --warn:#E5A84B; --warn-soft:#3A2B14; --bad:#F2705F; --bad-soft:#401C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --sunk:#1D2532; --ink:#E6EBF2; --muted:#97A3B4; --line:#283242;
  --accent:#93A6FF; --accent-ink:#0E131A; --accent-soft:#222C4D;
  --good:#53C58E; --good-soft:#163526; --warn:#E5A84B; --warn-soft:#3A2B14; --bad:#F2705F; --bad-soft:#401C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}
nav.tabs{display:flex;gap:4px;padding-bottom:10px;overflow-x:auto}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.num,.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 11px;font-size:13px}
.btn:focus-visible,.iconbtn:focus-visible,nav.tabs button:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border-radius:var(--r-s);padding:10px 12px;font-size:14px;background:var(--accent-soft)}
/* Mois */
.month{display:flex;align-items:center;gap:8px}
.month .lbl{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:capitalize}
.hero{display:flex;flex-direction:column;gap:6px;padding:20px}
.hero .k{font-size:13px;color:var(--muted);font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,11vw,60px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;width:fit-content}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin-top:8px}
.flow span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 16px;margin-top:10px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums}
.c-fix{background:var(--ink);opacity:.8} .c-save{background:var(--accent)} .c-var{background:var(--warn)} .c-rest{background:var(--good)} .c-over{background:var(--bad)}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin-top:10px}
.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--good)}
.gauge .fill.warn{background:var(--warn)} .gauge .fill.bad{background:var(--bad)}
.gauge .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px 11px 0;overflow:hidden}
.alert .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.alert.bad .stripe{background:var(--bad)} .alert.warn .stripe{background:var(--warn)} .alert.info .stripe{background:var(--accent)} .alert.good .stripe{background:var(--good)}
.alert b{display:block;font-size:14.5px}
.alert p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .main div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{font-weight:500}
.amt.pos{color:var(--good)} .amt.neg{color:var(--ink)} .amt.sav{color:var(--accent)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.off{text-decoration:line-through}
.grouplbl{padding:8px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--sunk);font-weight:600;display:flex;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:10px}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,4.6vw,22px);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .s{font-size:12.5px;color:var(--muted)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:14px 20px;font-weight:700;box-shadow:0 6px 20px rgba(20,28,40,.25);cursor:pointer;display:flex;gap:8px;align-items:center}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .axis{stroke:var(--line)}
/* comptes */
.acc{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.acc:first-child{border-top:0} .acc:hover{background:var(--sunk)}
.acc .top{display:flex;gap:10px;align-items:baseline}
.acc .name{font-weight:600;flex:1;min-width:0}
.acc .bal{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.capbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.capbar span{display:block;height:100%;background:var(--accent)}
.plan{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:baseline}
.plan .t{font-weight:600} .plan .d{font-size:13px;color:var(--muted);grid-column:1/-1;margin-top:-6px}
.plan .tot{border-top:1px solid var(--line);padding-top:8px}
.ladder{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 0}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.step.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.now .dot{border-color:var(--accent);color:var(--accent)}
.step b{display:block} .step p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:42ch}
/* feuille */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .head{display:flex;align-items:center;gap:10px}
.sheet .head h2{flex:1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:10px 12px;width:100%;min-width:0}
.field input.bigin{font-family:var(--f-display);font-size:28px;font-weight:700;padding:8px 12px}
.field .hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions .left{margin-right:auto}
.err{color:var(--bad);font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.banks{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.bankrow{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.negt{color:var(--bad)}
.passlist{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-s);padding:0 12px}
.passrow input{width:auto;flex:none;margin:0}
.passrow{padding:9px 0;border-top:1px solid var(--line)}.passrow:first-child{border-top:0}
.note{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Comptes du foyer<small id="modeLbl">Chargement…</small></div>
      <button class="iconbtn" id="btnSettings" aria-label="Réglages" data-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="mois" aria-selected="true">Mois</button>
      <button role="tab" data-tab="fixes" aria-selected="false">Fixes</button>
      <button role="tab" data-tab="epargne" aria-selected="false">Épargne</button>
      <button role="tab" data-tab="avenir" aria-selected="false">Avenir</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="card empty"><h2>Chargement de tes comptes…</h2><p>Tes revenus, charges fixes et livrets vont s'afficher ici.</p></div>
</main>
<div id="layer"></div>

<script>
"use strict";
/* ---------- Référentiels ---------- */
const CAT_OUT=["Logement","Énergie / eau","Courses","Transport / carburant","Assurances","Santé","Téléphone / internet","Abonnements","Crédits","Impôts","Banque / frais","Sport / trail","Loisirs / sorties","Restaurants","Shopping / équipement","Enfants","Cadeaux","Voyages","Divers"];
const CAT_IN=["Salaire","Aides / CAF","Remboursements","Revenus annexes","Autre revenu"];
// Catégories « vie courante » : comparées au budget du quotidien
const LIFE=new Set(["Courses","Transport / carburant","Santé","Sport / trail","Loisirs / sorties","Restaurants","Shopping / équipement","Enfants","Cadeaux","Divers"]);
const FREQ={mensuel:1,bimestriel:2,trimestriel:3,semestriel:6,annuel:12};
const FREQ_LBL={mensuel:"Mensuel",bimestriel:"Tous les 2 mois",trimestriel:"Trimestriel",semestriel:"Semestriel",annuel:"Annuel"};
const ROLES={securite:"Précaution (urgence)",tampon:"Tampon factures",projet:"Projets",enfant:"Enfant / proche",long:"Long terme / retraite"};
const DEFAULT_CFG={age:null,retireAge:64,lifeBudget:null,cushion:150,emergencyMonths:6,emergencyHorizon:24,savingsTarget:15};
const COLLS=["recurring","ops","accounts","projects","banks"];
const isOut=r=>r.kind!=="in"&&r.kind!=="transfer";
function defBank(){return S.banks[0]?.id||"main"}
function bankOf(x){const b=x&&x.bank;return b&&S.banks.some(y=>y.id===b)?b:defBank()}
function toOf(x){const b=x&&x.to;return b&&S.banks.some(y=>y.id===b)?b:defBank()}
function bankName(id){return (S.banks.find(b=>b.id===id)||{name:"Compte courant"}).name}
function lifeBankId(){const l=S.config.lifeBank;return l&&S.banks.some(b=>b.id===l)?l:defBank()}
const multi=()=>S.banks.length>1;
let lastBank=null;

/* ---------- État ---------- */
let S={config:{...DEFAULT_CFG},recurring:[],ops:[],accounts:[],projects:[],banks:[]};
let mode="loading", readOnly=false, db=null, loaded=new Set();
const today=new Date();
const CUR=mk(today.getFullYear(),today.getMonth()+1);
let viewMonth=CUR;
let tab=(()=>{const h=(location.hash||"").slice(1);return ["mois","fixes","epargne","avenir"].includes(h)?h:"mois"})();
let sim={acc:null,monthly:100,once:0,months:24,target:""};
let longMonthly=null;

/* ---------- Outils ---------- */
function mk(y,m){return y+"-"+String(m).padStart(2,"0")}
function pm(k){const[a,b]=k.split("-").map(Number);return{y:a,m:b}}
function addM(k,n){let{y,m}=pm(k);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return mk(y,m)}
function diffM(a,b){const A=pm(a),B=pm(b);return (B.y-A.y)*12+(B.m-A.m)}
function monthName(k,short){const{y,m}=pm(k);return new Date(y,m-1,1).toLocaleDateString("fr-FR",short?{month:"short"}:{month:"long",year:"numeric"})}
function num(v){const n=typeof v==="number"?v:parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function has(v){return v!==null&&v!==undefined&&v!==""&&isFinite(num(v))}
const nf0=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const e0=n=>nf0.format(Math.round(n)).replace(/-/,"−");
const e2=n=>nf2.format(n).replace(/-/,"−");
const pct=n=>(n*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayISO(){return mk(today.getFullYear(),today.getMonth()+1)+"-"+String(today.getDate()).padStart(2,"0")}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}

/* ---------- Calculs ---------- */
function recAmount(r,k){
  if(r.start&&k<r.start)return 0; if(r.end&&k>r.end)return 0;
  const ov=r.overrides&&r.overrides[k];
  if(ov){if(ov.skip)return 0;if(has(ov.amount))return num(ov.amount)}
  const base=num(r.amount), p=FREQ[r.freq]||1;
  if(p===1)return base;
  if(r.firstMonth){const d=diffM(r.firstMonth,k);return ((d%p)+p)%p===0?base:0}
  return base/p; // mois de prélèvement inconnu : lissé
}
function monthlyEq(r){return num(r.amount)/(FREQ[r.freq]||1)}
function activeNow(r){return !(r.end&&r.end<CUR)}
function accMonthly(){return sum(S.accounts,a=>num(a.monthly))}
function accEst(a){
  let b=num(a.balance);
  if(a.balanceDate&&has(a.balance)){
    const months=Math.max(0,diffM(a.balanceDate.slice(0,7),CUR));
    b+=num(a.monthly)*months;
    b+=sum(S.ops.filter(o=>o.kind==="save"&&o.account===a.id&&o.date>a.balanceDate&&o.date<=todayISO()),o=>num(o.amount));
  }
  return b;
}
function compute(k){
  const ops=S.ops.filter(o=>(o.date||"").slice(0,7)===k);
  const recIn=sum(S.recurring.filter(r=>r.kind==="in"),r=>recAmount(r,k));
  const recOut=sum(S.recurring.filter(r=>isOut(r)),r=>recAmount(r,k));
  const opsIn=sum(ops.filter(o=>o.kind==="in"),o=>num(o.amount));
  const opsSave=sum(ops.filter(o=>o.kind==="save"),o=>num(o.amount));
  const outs=ops.filter(o=>o.kind==="out");
  const life=sum(outs.filter(o=>LIFE.has(o.cat)),o=>num(o.amount));
  const other=sum(outs.filter(o=>!LIFE.has(o.cat)),o=>num(o.amount));
  const planned=accMonthly();
  const inc=recIn+opsIn, save=planned+opsSave, budget=num(S.config.lifeBudget);
  const lifeProj=budget>0?Math.max(life,budget):life;
  return {k,ops,recIn,recOut,opsIn,opsSave,life,other,planned,inc,save,budget,lifeProj,
    resteNow:inc-recOut-save-life-other, resteEst:inc-recOut-save-other-lifeProj};
}
/* Point de départ : solde du compte courant à une date donnée */
function startInfo(){const s=S.config.start;if(!s||!s.date)return null;
  let bal=s.balances&&typeof s.balances==="object"&&Object.keys(s.balances).length?s.balances:null;
  if(!bal){if(!has(s.balance))return null;bal={main:num(s.balance)}}
  const out={};Object.entries(bal).forEach(([k,v])=>{const kk=S.banks.some(b=>b.id===k)?k:defBank();out[kk]=(out[kk]||0)+num(v)});
  return {...s,balances:out,total:sum(Object.values(out),num),k:s.date.slice(0,7)}}
function opCounted(o,st){if(!st)return true;const d=o.date||"";if(d.slice(0,7)>st.k)return true;if(d<st.date)return false;if(d>st.date)return true;return num(o.createdAt)>num(st.at)}
function flowFromStart(k,st,B){
  const c=compute(k), isStart=!!(st&&k===st.k), P=isStart?(st.passed||{}):{};
  const inB=x=>!B||bankOf(x)===B, ra=r=>recAmount(r,k), am=o=>num(o.amount);
  const recs=S.recurring.filter(r=>!P[r.id]);
  const ops=c.ops.filter(o=>!isStart||opCounted(o,st));
  let inc=sum(recs.filter(r=>r.kind==="in"&&inB(r)),ra)+sum(ops.filter(o=>o.kind==="in"&&inB(o)),am);
  const fix=sum(recs.filter(r=>isOut(r)&&inB(r)),ra);
  let tin=0,tout=0;
  if(B){tin=sum(recs.filter(r=>r.kind==="transfer"&&toOf(r)===B),ra)+sum(ops.filter(o=>o.kind==="transfer"&&toOf(o)===B),am);
        tout=sum(recs.filter(r=>r.kind==="transfer"&&bankOf(r)===B),ra)+sum(ops.filter(o=>o.kind==="transfer"&&bankOf(o)===B),am)}
  const save=sum(S.accounts.filter(a=>!P["acc:"+a.id]&&inB(a)),a=>num(a.monthly))+sum(ops.filter(o=>o.kind==="save"&&inB(o)),am);
  const outs=ops.filter(o=>o.kind==="out"&&inB(o));
  const life=sum(outs.filter(o=>LIFE.has(o.cat)),am), other=sum(outs.filter(o=>!LIFE.has(o.cat)),am);
  let allowance=0;
  if(c.budget>0&&(!B||B===lifeBankId())){if(isStart){const {y,m}=pm(k),dim=new Date(y,m,0).getDate(),d0=num(st.date.slice(8,10));allowance=c.budget*(dim-d0+1)/dim}else allowance=c.budget}
  const vari=other+Math.max(life,allowance);
  return {inc,fix,save,vari,tin,tout,net:inc+tin-fix-tout-save-vari,life,allowance};
}
function projBal(k,B){const st=startInfo();if(!st||k<st.k)return null;let b=B?num(st.balances[B]):st.total;for(let m=st.k;m<=k;m=addM(m,1))b+=flowFromStart(m,st,B).net;return b}
function essentialsMonthly(){return sum(S.recurring.filter(r=>isOut(r)&&r.essential!==false&&activeNow(r)),monthlyEq)}
function emergency(){
  const target=num(S.config.emergencyMonths)*(essentialsMonthly()+num(S.config.lifeBudget));
  const cur=sum(S.accounts.filter(a=>a.role==="securite"),accEst);
  return {target,cur,gap:Math.max(0,target-cur)};
}
function provisions(){return S.recurring.filter(r=>isOut(r)&&(FREQ[r.freq]||1)>1&&activeNow(r)&&has(r.amount)).map(r=>({r,m:monthlyEq(r)}))}
function capacity(){ // avant épargne, en moyenne mensuelle
  const inc=sum(S.recurring.filter(r=>r.kind==="in"&&activeNow(r)),monthlyEq);
  const out=sum(S.recurring.filter(r=>isOut(r)&&activeNow(r)),monthlyEq);
  return {inc,out,cap:inc-out-num(S.config.lifeBudget)};
}
function projectsNeed(){return S.projects.map(p=>{const left=Math.max(0,num(p.target)-num(p.saved));const m=p.deadline?Math.max(1,diffM(CUR,p.deadline)):null;return{p,left,m,need:m?left/m:null}})}
function incomplete(){
  const out=[];
  S.recurring.forEach(r=>{
    const miss=[];
    if(!has(r.amount))miss.push("montant");
    if(!r.cat&&r.kind!=="transfer")miss.push("catégorie");
    if((FREQ[r.freq]||1)>1&&!r.firstMonth)miss.push("mois de prélèvement");
    if(miss.length)out.push({r,miss});
  });
  return out;
}
function transferPairs(){
  if(!multi())return [];
  const ins=S.recurring.filter(r=>r.kind==="in"&&activeNow(r)&&has(r.amount)), outs=S.recurring.filter(r=>isOut(r)&&activeNow(r)&&has(r.amount));
  const res=[],used=new Set();
  ins.forEach(i=>{const o=outs.find(o=>!used.has(o.id)&&Math.abs(num(o.amount)-num(i.amount))<0.01&&o.freq===i.freq&&bankOf(o)!==bankOf(i));if(o){used.add(o.id);res.push({i,o})}});
  return res;
}
async function mergeTransfer(oid,iid){
  const o=S.recurring.find(x=>x.id===oid), i=S.recurring.find(x=>x.id===iid); if(!o||!i)return;
  await put("recurring",o.id,{...strip(o),kind:"transfer",bank:bankOf(o),to:bankOf(i),cat:"Virement",essential:null,day:has(o.day)?o.day:(has(i.day)?i.day:null),label:`Virement vers ${bankName(bankOf(i))}`});
  await del("recurring",i.id); toast("Fusionné en virement");
}
const PRESETS={livretA:{n:"Livret A",rate:1.7,cap:22950,re:/\blivret a\b/},ldds:{n:"LDDS",rate:1.7,cap:12000,re:/\bldds\b/},lep:{n:"LEP",rate:2.5,cap:10000,re:/\blep\b/},jeune:{n:"Livret Jeune",cap:1600},pel:{n:"PEL",cap:61200},cel:{n:"CEL",cap:15300},av:{n:"Assurance-vie",cap:null},pea:{n:"PEA",cap:150000},per:{n:"PER",cap:null}};
function accountMismatch(){const out=[];S.accounts.forEach(a=>{const nm=norm(a.name);
  for(const p of Object.values(PRESETS)){if(!p.re||!p.re.test(nm))continue;
    if((has(a.rate)&&Math.abs(num(a.rate)-p.rate)>0.001)||(has(a.cap)&&num(a.cap)!==p.cap))out.push({a,msg:`Un ${p.n} rapporte ${p.rate.toLocaleString("fr-FR")} % et son plafond est de ${e0(p.cap)}. Ici : ${has(a.rate)?num(a.rate).toLocaleString("fr-FR")+" %":"taux vide"}, plafond ${has(a.cap)?e0(num(a.cap)):"vide"}. Corrige le taux ou le nom du compte.`});break}});return out}
function duplicates(k){
  const res=[];
  const st=startInfo();
  S.ops.filter(o=>o.kind==="out"&&(o.date||"").slice(0,7)===k&&opCounted(o,st)).forEach(o=>{
    S.recurring.filter(r=>isOut(r)).forEach(r=>{
      const a=recAmount(r,k); if(!a)return;
      if(Math.abs(a-num(o.amount))<0.01&&(norm(r.label).slice(0,4)===norm(o.label).slice(0,4)||r.cat===o.cat))res.push({o,r});
    });
  });
  return res;
}
function simulate({start,monthly,once,months,rate,cap}){
  // Livret : intérêts calculés chaque mois, crédités au 31 décembre (approximation des quinzaines)
  let bal=num(start)+num(once), pend=0, paid=num(start)+num(once), capHit=null, refused=0;
  if(cap&&bal>cap){refused+=bal-cap;paid-=bal-cap;bal=cap;capHit=0}
  const pts=[bal]; let k=CUR;
  for(let i=1;i<=months;i++){
    k=addM(k,1);
    let dep=num(monthly);
    if(cap&&bal+dep>cap){const ok=Math.max(0,cap-bal);refused+=dep-ok;dep=ok;if(capHit===null)capHit=i}
    bal+=dep; paid+=dep;
    pend+=bal*num(rate)/100/12;
    if(pm(k).m===12||i===months){bal+=pend;pend=0}
    pts.push(bal);
  }
  return {final:bal,paid,interest:bal-paid,capHit,refused,pts};
}
function fv(monthly,start,rate,months){let b=num(start);const r=rate/100/12;const pts=[b];for(let i=1;i<=months;i++){b=b*(1+r)+monthly;if(i%12===0||i===months)pts.push(b)}return {final:b,pts}}

/* ---------- Alertes ---------- */
function alerts(k){

  const st=startInfo();
  if(st&&k===st.k){const P=st.passed||{};
    const nod=[...S.recurring.filter(r=>r.kind!=="in"&&!P[r.id]&&!has(r.day)&&recAmount(r,k)>0).map(r=>({l:r.label,a:recAmount(r,k)})),
      ...S.accounts.filter(a=>num(a.monthly)>0&&!P["acc:"+a.id]&&!has(a.day)).map(a=>({l:a.name,a:num(a.monthly)}))];
    if(nod.length)A.push({lvl:"warn",t:`Point à vérifier : ${e0(sum(nod,x=>x.a))} encore considérés « à venir »`,p:`${nod.length} prélèvements ou virements sans jour n'ont pas été cochés au point du ${new Date(st.date+"T12:00").toLocaleDateString("fr-FR")} (${nod.slice(0,4).map(x=>x.l).join(", ")}${nod.length>4?"…":""}). S'ils sont déjà passés, refais le point en les cochant, sinon ton solde prévu est trop bas. Indique leur jour du mois pour que ce soit automatique.`,act:"start",btn:"Refaire le point"})}
  if(st&&k>=st.k){const b=projBal(k);
    if(b<0)A.push({lvl:"bad",t:`Découvert prévu : ${e0(b)} fin ${monthName(k,true)}`,p:`Avec ton solde du ${new Date(st.date+"T12:00").toLocaleDateString("fr-FR")} et ce qui reste à passer, ton compte finirait à découvert. Décale un achat ou réduis temporairement un versement d'épargne.`});
    if(multi()){const L=S.banks.map(x=>({x,v:projBal(k,x.id)}));const rich=[...L].sort((p,q)=>q.v-p.v)[0];
      L.filter(y=>y.v<0).forEach(y=>A.push({lvl:"bad",t:`Découvert prévu sur ${y.x.name} : ${e0(y.v)}`,p:rich&&rich.x.id!==y.x.id&&rich.v>-y.v?`Prévois un virement d'au moins ${e0(Math.ceil(-y.v))} depuis ${rich.x.name} avant fin ${monthName(k)}.`:`Ce compte ne couvre pas ses prélèvements d'ici fin ${monthName(k)}.`,act:"addop",btn:"Noter un virement"}))}
    if(b<0){}else if(b<num(cfg.cushion))A.push({lvl:"warn",t:`Solde bas prévu : ${e0(b)} fin ${monthName(k,true)}`,p:`En dessous de ta marge de sécurité de ${e0(num(cfg.cushion))}.`});
  } else if(c.resteEst<0)A.push({lvl:"bad",t:`Il manque ${e0(-c.resteEst)} ce mois-ci`,p:`Tes sorties prévues dépassent tes entrées. Réduis une dépense, décale un achat ou baisse temporairement un versement d'épargne.`});
  else if(c.resteEst<num(cfg.cushion))A.push({lvl:"warn",t:`Marge faible : ${e0(c.resteEst)} en fin de mois`,p:`Ta marge de sécurité est fixée à ${e0(num(cfg.cushion))}. Un imprévu te ferait passer dans le rouge.`});
  if(k===CUR&&c.budget>0){
    const dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate(), d=today.getDate();
    const f=d/dim, used=c.life/c.budget;
    if(c.life>c.budget)A.push({lvl:"bad",t:`Budget vie courante dépassé de ${e0(c.life-c.budget)}`,p:`${e0(c.life)} dépensés pour un budget de ${e0(c.budget)}.`});
    else if(used>f+0.12&&c.life>0)A.push({lvl:"warn",t:`Tu dépenses plus vite que prévu`,p:`${pct(used)} du budget utilisé au jour ${d} sur ${dim}. À ce rythme : environ ${e0(c.life/d*dim)} sur le mois pour ${e0(c.budget)} prévus.`});
  }
  if(!st&&!readOnly)A.push({lvl:"info",t:"Pas encore de point de départ",p:"Indique ton solde actuel pour voir combien il restera vraiment sur ton compte.",act:"start",btn:"Faire le point"});
  if(!(num(cfg.lifeBudget)>0))A.push({lvl:"warn",t:"Fixe ton budget vie courante",p:"Courses, carburant, sorties… Sans ce montant, le reste estimé ne compte que ce que tu as déjà saisi et paraît trop optimiste.",act:"settings",btn:"Régler"});
  (k===CUR?[k,addM(k,1),addM(k,2)]:[k]).forEach(kk=>duplicates(kk).forEach(({o,r})=>A.push({lvl:"warn",t:`Doublon possible : ${o.label} (${monthName(kk)})`,p:`${e2(num(o.amount))} est saisi en ponctuel alors que « ${r.label} » du même montant est déjà compté en récurrent ce mois-là.`,act:"op:"+o.id,btn:"Voir"})));
  accountMismatch().forEach(m=>A.push({lvl:"info",t:`Vérifie ${m.a.name}`,p:m.msg,act:"acc:"+m.a.id,btn:"Ouvrir"}));
  transferPairs().forEach(({i,o})=>A.push({lvl:"warn",t:`Virement compté deux fois ?`,p:`« ${i.label} » (entrée sur ${bankName(bankOf(i))}) et « ${o.label} » (sortie de ${bankName(bankOf(o))}) font ${e2(num(i.amount))}. Si c'est le même argent qui passe d'un compte à l'autre, ce n'est ni un revenu ni une dépense : fusionne-les en un virement.`,act:`merge:${o.id}|${i.id}`,btn:"Fusionner"}));
  const inc=incomplete();
  if(inc.length)A.push({lvl:"warn",t:`${inc.length} charge${inc.length>1?"s":""} fixe${inc.length>1?"s":""} à compléter`,p:inc.slice(0,4).map(x=>`${x.r.label} (${x.miss.join(", ")})`).join(" · ")+(inc.length>4?"…":""),act:"tab:fixes",btn:"Compléter"});
  const nextBills=[];
  for(let i=1;i<=2;i++){const kk=addM(k,i);S.recurring.filter(r=>isOut(r)&&(FREQ[r.freq]||1)>1&&r.firstMonth).forEach(r=>{const a=recAmount(r,kk);if(a)nextBills.push(`${monthName(kk,true)} : ${r.label} ${e0(a)}`)})}
  if(nextBills.length)A.push({lvl:"info",t:"Factures non mensuelles à venir",p:nextBills.join(" · ")});
  const rate=c.inc>0?c.planned/c.inc:0;
  if(c.inc>0&&rate<num(cfg.savingsTarget)/100)A.push({lvl:"info",t:`Taux d'épargne : ${pct(rate)} (objectif ${num(cfg.savingsTarget)} %)`,p:`Il faudrait ${e0(c.inc*num(cfg.savingsTarget)/100-c.planned)} de plus par mois en versements programmés.`,act:"tab:epargne",btn:"Voir"});
  const em=emergency();

  const noBal=S.accounts.filter(a=>!has(a.balance));

  return A;
}

function gauge(c){
  const dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate(), f=today.getDate()/dim, u=Math.min(1,c.life/c.budget);
  const cls=c.life>c.budget?"bad":u>f+0.12?"warn":"";
  return `<div style="margin-top:8px"><div class="sub note">Rythme de dépense vie courante : ${pct(c.life/c.budget)} du budget utilisé, ${pct(f)} du mois écoulé</div><div class="gauge"><div class="fill ${cls}" style="width:${(u*100).toFixed(1)}%"></div><div class="today" style="left:${(f*100).toFixed(1)}%" title="Aujourd'hui"></div></div></div>`;
}
function alertHtml(a){return `<div class="alert ${a.lvl}"><span class="stripe"></span><div><b>${esc(a.t)}</b><p>${esc(a.p)}</p></div>${a.act&&!(readOnly&&a.act==="settings")?`<button class="btn small" data-act="${esc(a.act)}">${esc(a.btn||"Voir")}</button>`:""}</div>`}
function forecastChart(){
  const ks=[...Array(6)].map((_,i)=>addM(CUR,i)), vals=ks.map(k=>startInfo()&&k>=startInfo().k?projBal(k):compute(k).resteEst);
  const W=420,H=190,P={l:52,r:6,t:16,b:24};
  let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn)mx=mn+100;
  const pad=(mx-mn)*0.12; mx+=pad; if(mn<0)mn-=pad;
  const y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b), bw=(W-P.l-P.r)/6;
  const ticks=niceTicks(mn,mx,4);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reste estimé des 6 prochains mois">`;
  ticks.forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t===0?1.5:1}" ${t===0?"":'stroke-dasharray="2 4"'}/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end">${e0(t)}</text>`});
  vals.forEach((v,i)=>{const x=P.l+i*bw+bw*0.2,w=bw*0.6,y0=y(0),yv=y(v);const col=v<0?"var(--bad)":v<num(S.config.cushion)?"var(--warn)":"var(--good)";
    s+=`<rect x="${x}" y="${Math.min(y0,yv)}" width="${w}" height="${Math.max(1,Math.abs(yv-y0))}" rx="4" fill="${col}" ${ks[i]===viewMonth?'':'opacity=".75"'}><title>${monthName(ks[i])} : ${e0(v)}</title></rect>`;
    s+=`<text x="${x+w/2}" y="${v>=0?yv-5:yv+13}" text-anchor="middle" style="fill:var(--ink);font-family:var(--f-num);font-size:11px">${e0(v)}</text>`;
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${monthName(ks[i],true)}</text>`});
  return s+"</svg>";
}
function niceTicks(mn,mx,n){const span=mx-mn,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0)||step0;const out=[];for(let t=Math.ceil(mn/st)*st;t<=mx+1e-9;t+=st)out.push(Math.round(t*100)/100);if(!out.includes(0)&&mn<=0&&mx>=0)out.push(0);return out}
function opsList(c){

function viewFixes(){

    const tin=sum(act.filter(r=>r.kind==="transfer"&&toOf(r)===id),monthlyEq), tout=sum(act.filter(r=>r.kind==="transfer"&&inB(r)),monthlyEq);
    const sav=sum(S.accounts.filter(inB),a=>num(a.monthly)), life=lifeBankId()===id?num(S.config.lifeBudget):0;
    return {inc,out,tin,tout,sav,life,net:inc+tin-out-tout-sav-life}};

    return `<button class="row" data-act="bank:${b.id}"><div class="main"><div>${esc(b.name)}</div><div class="sub">Entrées ${e0(x.inc)} · Sorties ${e0(x.out)}${x.sav?` · Épargne ${e0(x.sav)}`:""}${x.life?` · Vie courante ${e0(x.life)}`:""}${x.tin||x.tout?` · Virements +${e0(x.tin)} / −${e0(x.tout)}`:""}${x.net<0?`<span class="tag warn">À alimenter de ${e0(-x.net)}/mois</span>`:""}</div></div><div class="amt ${x.net<0?"negt":"pos"}">${x.net>=0?"+":""}${e0(x.net)}<div class="note">par mois</div></div></button>`}).join("");

function updateSim(){
  const out=$("#simOut"); if(!out)return;
  const a=S.accounts.find(x=>x.id===sim.acc);
  if(sim.rate===undefined||sim.rate===null)sim.rate=a&&has(a.rate)?num(a.rate):1.7;
  const months=Math.max(1,Math.min(600,Math.round(num(sim.months))));
  const r=simulate({start:a?accEst(a):0,monthly:sim.monthly,once:sim.once,months,rate:sim.rate,cap:a?num(a.cap):0});
  let rev="";
  if(has(sim.target)&&num(sim.target)>0){
    let lo=0,hi=num(sim.target);for(let i=0;i<40;i++){const mid=(lo+hi)/2;const t=simulate({start:a?accEst(a):0,monthly:mid,once:sim.once,months,rate:sim.rate,cap:0}).final;if(t>=num(sim.target))hi=mid;else lo=mid}
    rev=`<div class="banner">Pour atteindre ${e0(num(sim.target))} en ${months} mois : <b>${e0(Math.ceil(hi))}/mois</b>${a&&num(a.cap)&&num(sim.target)>num(a.cap)?` (au-delà du plafond de ${e0(num(a.cap))} : il faudra un second compte)`:""}.</div>`;
  }
  out.innerHTML=`<div class="stats"><div class="stat"><div class="k">Dans ${months} mois</div><div class="v">${e0(r.final)}</div><div class="s">${monthName(addM(CUR,months))}</div></div><div class="stat"><div class="k">Dont versé par toi</div><div class="v">${e0(r.paid)}</div><div class="s">solde actuel inclus</div></div><div class="stat"><div class="k">Intérêts</div><div class="v">${e0(r.interest)}</div><div class="s">à ${num(sim.rate).toLocaleString("fr-FR")} %/an</div></div></div>
  ${r.capHit!==null?`<div class="banner" style="background:var(--warn-soft)">Plafond atteint ${r.capHit===0?"dès maintenant":"au mois "+r.capHit}. ${e0(r.refused)} ne pourront pas être versés sur ce compte.</div>`:""}${rev}
  ${lineChart([{pts:r.pts,col:"var(--accent)"}],months,"Évolution du solde")}`;
}
function lineChart(series,months,label,yearsLabels){
  const W=420,H=200,P={l:54,r:8,t:12,b:24};
  const all=series.flatMap(s=>s.pts);let mx=Math.max(...all,1),mn=0;mx*=1.08;
  const n=series[0].pts.length-1||1;
  const x=i=>P.l+i/n*(W-P.l-P.r), y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  niceTicks(mn,mx,4).filter(t=>t<=mx).forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t?'stroke-dasharray="2 4"':""}/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end">${e0(t)}</text>`});
  const lbls=yearsLabels||[0,Math.round(n/2),n].map(i=>({i,t:i===0?"Auj.":monthName(addM(CUR,Math.round(i/n*months)),true)+" "+pm(addM(CUR,Math.round(i/n*months))).y}));
  lbls.forEach(l=>{s+=`<text x="${x(l.i)}" y="${H-8}" text-anchor="${l.i===0?"start":l.i===n?"end":"middle"}">${esc(l.t)}</text>`});
  series.forEach(se=>{const d=se.pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    if(series.length===1)s+=`<path d="${d}L${x(n)},${y(0)}L${x(0)},${y(0)}Z" fill="${se.col}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.col}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(n)}" cy="${y(se.pts[n])}" r="4" fill="${se.col}"/>`});
  return s+"</svg>";
}

function strip(o){const c={...o};delete c.id;return c}
async function put(coll,id,doc){
  if(readOnly)throw new Error("Lecture seule : seul le propriétaire peut modifier.");
  const clean=JSON.parse(JSON.stringify(strip(doc)));
  if(mode==="db"){try{await db.collection(coll).doc(id).set(clean)}catch(e){if(e&&e.code==="invalid_argument"){readOnly=true;render()}throw new Error("Enregistrement impossible ("+(e&&e.code||"erreur")+").")}}
  else{const L=S[coll];const i=L.findIndex(x=>x.id===id);const v={id,...clean};if(i>=0)L[i]=v;else L.push(v);sortColl(coll,L);if(mode==="demo")mode="local";persist();if(mode==="api")enqueue({op:"put",coll,id,data:clean});render()}
}
async function del(coll,id){
  if(mode==="db"){await db.collection(coll).doc(id).delete()}
  else{S[coll]=S[coll].filter(x=>x.id!==id);persist();if(mode==="api")enqueue({op:"del",coll,id});render()}
}
async function putConfig(cfg){
  if(mode==="db"){await db.doc("config/main").set(JSON.parse(JSON.stringify(cfg)))}
  else{S.config=cfg;if(mode==="demo")mode="local";persist();if(mode==="api")enqueue({op:"put",coll:"config",id:"main",data:JSON.parse(JSON.stringify(cfg))});render()}

/* ---------- Synchronisation serveur (version Vercel + Neon) ---------- */
const QKEY="comptes-foyer-queue", MKEY="comptes-foyer-mode";
const api={online:true,queue:[],busy:false,timer:null,migrate:null,error:null};
function loadQueue(){try{api.queue=JSON.parse(localStorage.getItem(QKEY)||"[]")}catch{api.queue=[]}}
function saveQueue(){try{localStorage.setItem(QKEY,JSON.stringify(api.queue))}catch{}}
function enqueue(op){api.queue=api.queue.filter(o=>!(o.coll===op.coll&&o.id===op.id));api.queue.push(op);saveQueue();clearTimeout(api.timer);api.timer=setTimeout(flush,300)}
async function flush(){
  if(api.busy||!api.queue.length||mode!=="api")return;
  api.busy=true;const batch=api.queue.slice(0,400);
  try{const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ops:batch}),cache:"no-store"});
    if(r.status===401){mode="login";return}
    if(!r.ok){const j=await r.json().catch(()=>({}));api.error=j.error||("Erreur serveur "+r.status);throw new Error(api.error)}
    api.queue=api.queue.filter(o=>!batch.includes(o));saveQueue();api.online=true;api.error=null;
  }catch(e){if(!api.error)api.online=false}
  finally{api.busy=false;render();if(api.queue.length&&api.online&&!api.error&&mode==="api")setTimeout(flush,50)}
}
async function pull(){
  if(mode!=="api")return;
  if(api.queue.length){await flush();if(api.queue.length)return}
  try{const r=await fetch("/api/state",{cache:"no-store"});
    if(r.status===401){mode="login";render();return}
    if(!r.ok)throw new Error();
    const d=await r.json(), before=S;
    const serverEmpty=!(d.recurring||[]).length&&!(d.accounts||[]).length&&!(d.ops||[]).length;
    if(serverEmpty&&(before.recurring.length||before.accounts.length)){api.migrate=JSON.parse(JSON.stringify(before));render();return}
    S={config:{...DEFAULT_CFG,...(d.config||{})},recurring:[],ops:[],accounts:[],projects:[],banks:[]};
    COLLS.forEach(c=>S[c]=sortColl(c,d[c]||[]));
    api.online=true;persist();render();
  }catch{api.online=false;render()}
}

  try{const r=await fetch("/api/me",{cache:"no-store"});if(r.status===200)return "ok";if(r.status===401)return "login";if(r.status===500)return "error";return "none"}
  catch{try{return localStorage.getItem(MKEY)==="api"?"offline":"none"}catch{return "none"}}

  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:f.querySelector("#loginPw").value}),cache:"no-store"});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Connexion impossible.");
    mode="api";try{localStorage.setItem(MKEY,"api")}catch{};render();await flush();await pull();toast("Connecté")}
  catch(e){err.textContent=e.message==="Failed to fetch"?"Pas de connexion internet.":e.message;err.hidden=false}}
async function doLogout(){
  if(api.queue.length&&!f_confirmLogout){f_confirmLogout=true;toast(api.queue.length+" modification(s) pas encore envoyée(s). Reclique pour te déconnecter quand même.");return}
  try{await fetch("/api/logout",{method:"POST",cache:"no-store"})}catch{}
  api.queue=[];saveQueue();try{localStorage.removeItem("comptes-foyer")}catch{}
  S={config:{...DEFAULT_CFG},recurring:[],ops:[],accounts:[],projects:[],banks:[]};mode="login";closeSheet();render();
}
let f_confirmLogout=false;
async function importAll(d){
  for(const c of COLLS){for(const x of [...S[c]])await del(c,x.id);for(const x of (d[c]||[]))await put(c,x.id||uid(),x)}
  await putConfig({...DEFAULT_CFG,...(d.config||{})});
}
function persist(){try{localStorage.setItem("comptes-foyer",JSON.stringify(S))}catch{}}
function sortColl(c,L){
  if(c==="recurring")return L.sort((a,b)=>(a.kind===b.kind?0:a.kind==="in"?-1:1)||monthlyEq(b)-monthlyEq(a));
  if(c==="accounts")return L.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(c==="banks")return L.sort((a,b)=>num(a.order)-num(b.order));
  return L;
}
function demoData(){
  const k=CUR, d=n=>k+"-"+String(Math.min(n,28)).padStart(2,"0");
  return {config:{...DEFAULT_CFG,age:35,lifeBudget:450},
   recurring:[{id:"d1",kind:"in",label:"Salaire (exemple)",cat:"Salaire",amount:2100,freq:"mensuel"},{id:"d2",kind:"out",label:"Loyer (exemple)",cat:"Logement",amount:720,freq:"mensuel",essential:true},{id:"d3",kind:"out",label:"Électricité (exemple)",cat:"Énergie / eau",amount:85,freq:"mensuel",essential:true},{id:"d4",kind:"out",label:"Assurance auto (exemple)",cat:"Assurances",amount:150,freq:"trimestriel",firstMonth:addM(k,1),essential:true},{id:"d5",kind:"out",label:"Streaming (exemple)",cat:"Abonnements",amount:11.99,freq:"mensuel",essential:false}],
   ops:[{id:"o1",kind:"out",label:"Courses (exemple)",cat:"Courses",amount:96.4,date:d(3)},{id:"o2",kind:"out",label:"Carburant (exemple)",cat:"Transport / carburant",amount:62,date:d(6)}],
   accounts:[{id:"a1",name:"Livret A (exemple)",role:"securite",balance:1800,balanceDate:d(1),rate:1.7,cap:22950,monthly:150}],projects:[],banks:[]};
}
async function boot(){
  render();
  let c=null; try{c=window.claude&&window.claude.use?await window.claude.use("db"):null}catch{c=null}
  if(!c){
    let saved=null;try{saved=JSON.parse(localStorage.getItem("comptes-foyer")||"null")}catch{}
    const inClaude=!!(window.claude&&window.claude.use);
    if(!inClaude){const pr=await probeApi();
      if(pr!=="none"){try{localStorage.setItem(MKEY,"api")}catch{}
        let cache=null;try{cache=JSON.parse(localStorage.getItem("comptes-foyer")||"null")}catch{}
        if(cache&&Array.isArray(cache.recurring))S={...S,...cache,config:{...DEFAULT_CFG,...(cache.config||{})}};
        loadQueue();
        const sync=()=>{if(mode==="api"){api.error=null;api.online=true;flush().then(pull)}};
        window.addEventListener("online",sync);
        document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
        setInterval(()=>{if(mode==="api"&&api.queue.length)flush()},30000);
        if(pr==="login"){mode="login";render();return}
        mode="api";api.online=pr!=="offline";if(pr==="error")api.error="configuration du serveur incomplète (voir le README)";
        render();
        sync();
        try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
        return}}
    if(saved&&Array.isArray(saved.recurring)){S={...S,...saved,config:{...DEFAULT_CFG,...(saved.config||{})}};mode="local"}
    else if(inClaude){S=demoData();mode="demo"}
    else mode="local";
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
    render();return;
  }
  db=c;
  try{const u=await window.claude.use("user");if(u){const can=await u.can("data.write");if(can===false)readOnly=true}}catch{}
  setTimeout(()=>{if(mode==="loading"){mode="db";render()}},8000);
  const ready=()=>{if(loaded.size>=COLLS.length+1&&mode==="loading"){mode="db"}render()};
  COLLS.forEach(coll=>db.collection(coll).onSnapshot(s=>{S[coll]=sortColl(coll,s.docs.map(d=>({id:d.id,...d.data()})));loaded.add(coll);ready()},err=>{if(err&&err.code==="revoked"){readOnly=true;render()}}));
  db.doc("config/main").onSnapshot(s=>{S.config={...DEFAULT_CFG,...(s.exists?s.data():{})};loaded.add("config");ready()},()=>{});
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act]"); if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;try{history.replaceState(null,"","#"+tab)}catch{}render();window.scrollTo({top:0});return}
  const a=t.dataset.act; if(a==="close"){if(e.target===t||t.tagName==="BUTTON")closeSheet();return}
  const [k,id]=a.split(":");
  if(k==="prev"){viewMonth=addM(viewMonth,-1);render()} else if(k==="next"){viewMonth=addM(viewMonth,1);render()} else if(k==="today"){viewMonth=CUR;render()}
  else if(k==="tab"){closeSheet();tab=id;render();window.scrollTo({top:0})}
  else if(k==="settings")settingsSheet();
  else if(k==="export")exportJson();
  else if(k==="migrate"){const d=api.migrate;api.migrate=null;if(d){S={config:{...DEFAULT_CFG},recurring:[],ops:[],accounts:[],projects:[],banks:[]};importAll(d).then(()=>toast("Données envoyées vers ton compte"))}}
  else if(k==="start"){if(readOnly)toast("Lecture seule");else startSheet()}
  else if(k==="merge"){if(readOnly)toast("Lecture seule");else{const [oid,iid]=id.split("|");mergeTransfer(oid,iid).catch(x=>toast(x.message))}}
  else if(k==="addbank"){if(readOnly)toast("Lecture seule");else bankSheet()}
  else if(k==="bank"){const x=S.banks.find(y=>y.id===id);x&&bankSheet(x)}
  else if(readOnly&&["addop","addrec","addacc","addproj"].includes(k))toast("Lecture seule");
  else if(k==="addop")opSheet(); else if(k==="addrec")recSheet(); else if(k==="addacc")accSheet(); else if(k==="addproj")projSheet();
  else if(k==="op"){const o=S.ops.find(x=>x.id===id);o&&opSheet(o)}
  else if(k==="rec"){const r=S.recurring.find(x=>x.id===id);r&&recSheet(r)}
  else if(k==="recmonth"){const r=S.recurring.find(x=>x.id===id);r&&recMonthSheet(r)}
  else if(k==="acc"){const x=S.accounts.find(y=>y.id===id);x&&accSheet(x)}
  else if(k==="proj"){const x=S.projects.find(y=>y.id===id);x&&projSheet(x)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)closeSheet()});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(["simRate","simMonthly","simOnce","simMonths","simTarget"].includes(id)){sim[{simRate:"rate",simMonthly:"monthly",simOnce:"once",simMonths:"months",simTarget:"target"}[id]]=e.target.value;updateSim()}
  if(id==="longM"){longMonthly=num(e.target.value);updateLong()}
});
document.addEventListener("change",e=>{if(e.target.id==="impEmpty"){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.recurring))throw new Error();await importAll(d);toast("Données importées")}catch{toast("Ce fichier n'est pas une sauvegarde de l'application.")}};rd.readAsText(file);return}if(e.target.id==="simAcc"){sim.acc=e.target.value;const a=S.accounts.find(x=>x.id===sim.acc);sim.rate=a&&has(a.rate)?num(a.rate):1.7;render()}});
document.addEventListener("submit",async e=>{const f=e.target;if(f.dataset.form==="login"){e.preventDefault();doLogin(f);return}if(f.dataset.form==="age"){e.preventDefault();const v=num(f.querySelector("#ageIn").value);if(v<14||v>110){toast("Âge invalide");return}try{await putConfig({...S.config,age:v});toast("Âge enregistré")}catch(x){toast(x.message)}}});
boot();
</script>

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
