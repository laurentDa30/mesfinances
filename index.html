<style>
/* Layout : une colonne de 720px, en-tête collant avec onglets ; chaque onglet = synthèse en haut, détail dessous */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E8EE; --ink:#141C28; --muted:#5A6576; --line:#D6DCE4;
  --accent:#2C46B1; --accent-ink:#FFFFFF; --accent-soft:#E2E7FA;
  --good:#16794A; --good-soft:#DDF2E6; --warn:#A8670E; --warn-soft:#FBEBD2; --bad:#B8322A; --bad-soft:#F8DEDA;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --sunk:#1D2532; --ink:#E6EBF2; --muted:#97A3B4; --line:#283242;
  --accent:#93A6FF; --accent-ink:#0E131A; --accent-soft:#222C4D;
  --good:#53C58E; --good-soft:#163526; --warn:#E5A84B; --warn-soft:#3A2B14; --bad:#F2705F; --bad-soft:#401C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --sunk:#1D2532; --ink:#E6EBF2; --muted:#97A3B4; --line:#283242;
  --accent:#93A6FF; --accent-ink:#0E131A; --accent-soft:#222C4D;
  --good:#53C58E; --good-soft:#163526; --warn:#E5A84B; --warn-soft:#3A2B14; --bad:#F2705F; --bad-soft:#401C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}
main{padding-block:18px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.num,.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.banner{border-radius:var(--r-s);padding:10px 12px;font-size:14px;background:var(--accent-soft)}
/* Mois */
.month{display:flex;align-items:center;gap:8px}
.month .lbl{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:capitalize}
.bubble{position:relative;color:#fff;border-radius:26px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  background:radial-gradient(120% 90% at 85% 0%,rgba(150,120,255,.55),transparent 60%),linear-gradient(135deg,#25349A 0%,#3550E0 55%,#7A4BF0 100%);
  box-shadow:0 14px 30px -12px rgba(53,80,224,.55),0 8px 0 -2px color-mix(in srgb,#3550E0 22%,var(--bg))}
.bubble.warn{background:radial-gradient(120% 90% at 85% 0%,rgba(255,190,90,.45),transparent 60%),linear-gradient(135deg,#25349A 0%,#4A49C9 50%,#B5652A 100%)}
.bubble.neg{background:radial-gradient(120% 90% at 85% 0%,rgba(255,140,110,.45),transparent 60%),linear-gradient(135deg,#7A1426 0%,#B4232E 55%,#E0603A 100%);box-shadow:0 14px 30px -12px rgba(180,35,46,.55),0 8px 0 -2px color-mix(in srgb,#B4232E 22%,var(--bg))}
#moisdet{scroll-margin-top:96px}
.btop{display:flex;justify-content:space-between;align-items:center}
.bt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;opacity:.95}

.bubble .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}

.bk{display:flex;align-items:center;gap:5px;font-size:12.5px;opacity:.9;white-space:nowrap}

.bst b{font-family:var(--f-display);font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.hero.flash{animation:flash 1.2s ease}@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;width:fit-content}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin-top:8px}
.flow span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 16px;margin-top:10px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums}
.c-fix{background:var(--ink);opacity:.8} .c-save{background:var(--accent)} .c-var{background:var(--warn)} .c-rest{background:var(--good)} .c-over{background:var(--bad)}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin-top:10px}

.gauge .fill.warn{background:var(--warn)} .gauge .fill.bad{background:var(--bad)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px 11px 0;overflow:hidden}
.alert .stripe{align-self:stretch;border-radius:0 3px 3px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}

.row .main{flex:1;min-width:0}

.amt.pos{color:var(--good)} .amt.neg{color:var(--ink)} .amt.sav{color:var(--accent)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}

.grouplbl{padding:8px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--sunk);font-weight:600;display:flex;justify-content:space-between}
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px;margin-top:6px;padding:10px 12px;background:var(--sunk);border-radius:var(--r-s)}
.eq .eqt{font-weight:700;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.pend summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent);margin-top:4px}
.pendlist{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.pendlist>div{display:flex;justify-content:space-between;gap:12px}
.today{display:flex;flex-direction:column;gap:6px;border-width:1.5px}
.today.good{border-color:var(--good)} .today.warn{border-color:var(--warn)} .today.bad{border-color:var(--bad)}
.today .k{font-size:13px;color:var(--muted);font-weight:600}
.today .tbig{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--good)}
.today.warn .tbig{color:var(--warn)} .today .tbig.neg{color:var(--bad)}
.envs{display:flex;flex-direction:column;gap:12px}
.env{display:flex;flex-direction:column;gap:5px}
.envtop{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.envn{font-weight:600}
.capbar.envbar span{background:var(--good)} .capbar.envbar.warn span{background:var(--warn)} .capbar.envbar.bad span{background:var(--bad)}
.envtot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.envrows{display:flex;flex-direction:column;gap:8px}

.simactions{display:flex;flex-direction:column;gap:10px}

.authcard{max-width:440px;margin:20px auto 0;width:100%;display:flex;flex-direction:column;gap:14px}

.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.curtag{display:block;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bkbtns{display:flex;flex-direction:column;gap:10px}
.bkbig{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px 16px;cursor:pointer;font:inherit}

.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.orline::before,.orline::after{content:"";flex:1;border-top:1px solid var(--line)}

.groups{display:flex;flex-direction:column;gap:8px}

.stat .s{font-size:12.5px;color:var(--muted)}

  display:grid;grid-template-columns:repeat(2,1fr) 76px repeat(2,1fr);align-items:center;gap:2px;padding:8px 8px;border-radius:26px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);

<script>
"use strict";
/* ---------- Référentiels ---------- */
const CAT_OUT=["Logement","Énergie / eau","Courses","Transport / carburant","Assurances","Santé","Téléphone / internet","Abonnements","Crédits","Impôts","Banque / frais","Sport / trail","Loisirs / sorties","Restaurants","Shopping / équipement","Enfants","Cadeaux","Voyages","Divers"];
const CAT_IN=["Salaire","Revenu locatif","Aides / CAF","Remboursements","Revenus annexes","Autre revenu"];
// Catégories « vie courante » : comparées au budget du quotidien
const LIFE=new Set(["Courses","Transport / carburant","Santé","Sport / trail","Loisirs / sorties","Restaurants","Shopping / équipement","Enfants","Cadeaux","Divers"]);
const FREQ={mensuel:1,bimestriel:2,trimestriel:3,semestriel:6,annuel:12};
const FREQ_LBL={mensuel:"Mensuel",bimestriel:"Tous les 2 mois",trimestriel:"Trimestriel",semestriel:"Semestriel",annuel:"Annuel"};
const ROLES={securite:"Précaution (urgence)",tampon:"Tampon factures",projet:"Projets",enfant:"Enfant / proche",long:"Long terme / retraite"};
const DEFAULT_CFG={age:null,retireAge:64,lifeBudget:null,cushion:150,emergencyMonths:6,emergencyHorizon:24,savingsTarget:15};
const COLLS=["recurring","ops","accounts","projects","banks"];
const isOut=r=>r.kind!=="in"&&r.kind!=="transfer";
function defBank(){return S.banks[0]?.id||"main"}
function bankOf(x){const b=x&&x.bank;return b&&S.banks.some(y=>y.id===b)?b:defBank()}
function toOf(x){const b=x&&x.to;return b&&S.banks.some(y=>y.id===b)?b:defBank()}
function bankName(id){return (S.banks.find(b=>b.id===id)||{name:"Compte courant"}).name}
function lifeBankId(){const l=S.config.lifeBank;return l&&S.banks.some(b=>b.id===l)?l:defBank()}
const multi=()=>S.banks.length>1;
let lastBank=null;

/* ---------- État ---------- */
let S={config:{...DEFAULT_CFG},recurring:[],ops:[],accounts:[],projects:[],banks:[]};
let mode="loading", readOnly=false, db=null, loaded=new Set();
const today=new Date();
const CUR=mk(today.getFullYear(),today.getMonth()+1);
let viewMonth=CUR;
let tab=(()=>{const h=(location.hash||"").slice(1);return ["mois","fixes","epargne","avenir"].includes(h)?h:"mois"})();
let sim={loadedFor:undefined,drive:"monthly",acc:null,monthly:100,once:0,months:24,target:""};
let longMonthly=null;
const openGroups=new Set();

/* ---------- Outils ---------- */
function mk(y,m){return y+"-"+String(m).padStart(2,"0")}
function pm(k){const[a,b]=k.split("-").map(Number);return{y:a,m:b}}
function addM(k,n){let{y,m}=pm(k);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return mk(y,m)}
function diffM(a,b){const A=pm(a),B=pm(b);return (B.y-A.y)*12+(B.m-A.m)}
function monthName(k,short){const{y,m}=pm(k);return new Date(y,m-1,1).toLocaleDateString("fr-FR",short?{month:"short"}:{month:"long",year:"numeric"})}
function num(v){const n=typeof v==="number"?v:parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function has(v){return v!==null&&v!==undefined&&v!==""&&isFinite(num(v))}
const nf0=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const e0=n=>nf0.format(Math.round(n)).replace(/-/,"−");
const e2=n=>nf2.format(n).replace(/-/,"−");
const pct=n=>(n*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayISO(){return mk(today.getFullYear(),today.getMonth()+1)+"-"+String(today.getDate()).padStart(2,"0")}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}

/* ---------- Calculs ---------- */
function recAmount(r,k){
  if(r.start&&k<r.start)return 0; if(r.end&&k>r.end)return 0;
  const ov=r.overrides&&r.overrides[k];
  if(ov){if(ov.skip)return 0;if(has(ov.amount))return num(ov.amount)}
  const base=num(r.amount), p=FREQ[r.freq]||1;
  if(p===1)return base;
  if(r.firstMonth){const d=diffM(r.firstMonth,k);return ((d%p)+p)%p===0?base:0}
  return base/p; // mois de prélèvement inconnu : lissé
}
function monthlyEq(r){return num(r.amount)/(FREQ[r.freq]||1)}
function activeNow(r){return !(r.end&&r.end<CUR)}
function accMonthly(){return sum(S.accounts,a=>num(a.monthly))}
function accAmt(a,k){const ov=a.overrides&&a.overrides[k];return ov&&ov.skip?0:num(a.monthly)}
function accEst(a){
  let b=num(a.balance);
  if(a.balanceDate&&has(a.balance)){
    const months=Math.max(0,diffM(a.balanceDate.slice(0,7),CUR));
    for(let i=1;i<=months;i++)b+=accAmt(a,addM(a.balanceDate.slice(0,7),i));
    const after=o=>o.account===a.id&&o.date>a.balanceDate&&o.date<=todayISO();
    b+=sum(S.ops.filter(o=>o.kind==="save"&&after(o)),o=>num(o.amount))-sum(S.ops.filter(o=>o.kind==="withdraw"&&after(o)),o=>num(o.amount));
  }
  return b;
}
function compute(k){
  const ops=S.ops.filter(o=>(o.date||"").slice(0,7)===k);
  const recIn=sum(S.recurring.filter(r=>r.kind==="in"),r=>recAmount(r,k));
  const recOut=sum(S.recurring.filter(r=>isOut(r)),r=>recAmount(r,k));
  const opsIn=sum(ops.filter(o=>o.kind==="in"),o=>num(o.amount));
  const opsSave=sum(ops.filter(o=>o.kind==="save"),o=>num(o.amount))-sum(ops.filter(o=>o.kind==="withdraw"),o=>num(o.amount));
  const outs=ops.filter(o=>o.kind==="out");
  const lifeOps=outs.filter(isLife);
  const life=sum(lifeOps,o=>num(o.amount));
  const other=sum(outs.filter(o=>!isLife(o)),o=>num(o.amount));
  const planned=sum(S.accounts,a=>accAmt(a,k));
  const inc=recIn+opsIn, save=planned+opsSave, budget=lifePlan().total;
  const lifeProj=life+lifeReserve(lifeOps,1).R;
  return {k,ops,recIn,recOut,opsIn,opsSave,life,other,planned,inc,save,budget,lifeProj,
    resteNow:inc-recOut-save-life-other, resteEst:inc-recOut-save-other-lifeProj};
}
/* Point de départ : solde du compte courant à une date donnée */
function startInfo(){const s=S.config.start;if(!s||!s.date)return null;
  let bal=s.balances&&typeof s.balances==="object"&&Object.keys(s.balances).length?s.balances:null;
  if(!bal){if(!has(s.balance))return null;bal={main:num(s.balance)}}
  const out={};Object.entries(bal).forEach(([k,v])=>{const kk=S.banks.some(b=>b.id===k)?k:defBank();out[kk]=(out[kk]||0)+num(v)});
  return {...s,balances:out,total:sum(Object.values(out),num),k:s.date.slice(0,7)}}
function opCounted(o,st){if(!st)return true;const d=o.date||"";if(d.slice(0,7)>st.k)return true;if(d<st.date)return false;if(d>st.date)return true;return num(o.createdAt)>num(st.at)}
function flowFromStart(k,st,B){
  const c=compute(k), isStart=!!(st&&k===st.k), done=(key,day)=>isStart&&isPassed(st,key,day);
  const inB=x=>!B||bankOf(x)===B, ra=r=>recAmount(r,k), am=o=>num(o.amount);
  const recs=S.recurring.filter(r=>!done(r.id,r.day));
  const ops=c.ops.filter(o=>!isStart||opCounted(o,st));
  let inc=sum(recs.filter(r=>r.kind==="in"&&inB(r)),ra)+sum(ops.filter(o=>o.kind==="in"&&inB(o)),am);
  const fix=sum(recs.filter(r=>isOut(r)&&inB(r)),ra);
  let tin=0,tout=0;
  if(B){tin=sum(recs.filter(r=>r.kind==="transfer"&&toOf(r)===B),ra)+sum(ops.filter(o=>o.kind==="transfer"&&toOf(o)===B),am);
        tout=sum(recs.filter(r=>r.kind==="transfer"&&bankOf(r)===B),ra)+sum(ops.filter(o=>o.kind==="transfer"&&bankOf(o)===B),am)}
  const save=sum(S.accounts.filter(a=>!done("acc:"+a.id,a.day)&&inB(a)),a=>accAmt(a,k))+sum(ops.filter(o=>o.kind==="save"&&inB(o)),am)-sum(ops.filter(o=>o.kind==="withdraw"&&inB(o)),am);
  const outs=ops.filter(o=>o.kind==="out"&&inB(o));
  const life=sum(outs.filter(isLife),am), other=sum(outs.filter(o=>!isLife(o)),am);
  const {y,m}=pm(k),dim=new Date(y,m,0).getDate(),fr=isStart?(dim-num(st.date.slice(8,10))+1)/dim:1;
  const res=lifeReserve(ops.filter(isLife),fr), allowance=res.total;
  const vari=other+life+((!B||B===lifeBankId())?res.R:0);
  return {inc,fix,save,vari,tin,tout,net:inc+tin-fix-tout-save-vari,life,allowance};
}
/* Déjà passé au moment du point : coché (true), décoché explicitement (false), sinon déduit du jour du mois */
function isPassed(st,key,day){const P=st.passed||{};if(P[key]===true)return true;if(P[key]===false)return false;return has(day)&&num(day)<=num(st.date.slice(8,10))}
function pendingItems(st){const k=st.k,bn=x=>multi()?" · "+(x.kind==="transfer"?bankName(bankOf(x))+" → "+bankName(toOf(x)):bankName(bankOf(x))):"";
  return [...S.recurring.filter(r=>!isPassed(st,r.id,r.day)&&recAmount(r,k)>0).map(r=>({l:r.label+bn(r),a:recAmount(r,k),s:r.kind==="in"?"+":r.kind==="transfer"?"⇄ ":"−",d:r.day})),
    ...S.accounts.filter(a=>accAmt(a,k)>0&&!isPassed(st,"acc:"+a.id,a.day)).map(a=>({l:"Virement vers "+a.name+bn(a),a:accAmt(a,k),s:"→ ",d:a.day}))].sort((x,y)=>(y.a-x.a))}
function balanceOn(date,B){const st=startInfo();if(!st||date<st.date)return null;
  const d0=num(st.date.slice(8,10)),inB=x=>!B||bankOf(x)===B;let b=B?num(st.balances[B]):st.total,undated=0;const items=[],und=[];const add=(l,v,dt,key)=>{b+=v;items.push({l,v,dt,key:isSt0(dt)?key:null})},isSt0=dt=>dt&&dt.slice(0,7)===st.k;
  for(let m=st.k;m<=date.slice(0,7);m=addM(m,1)){const {y,m:mm}=pm(m),dim=new Date(y,mm,0).getDate(),last=m===date.slice(0,7)?num(date.slice(8,10)):dim,isSt=m===st.k;
    const inWin=(key,day,lbl,v)=>{if(isSt&&isPassed(st,key,day))return false;if(!has(day)){undated++;und.push({l:lbl,v});return false}const dd=Math.min(dim,num(day));return (!isSt||dd>d0)&&dd<=last};
    const dt=day=>m+"-"+String(Math.min(dim,num(day))).padStart(2,"0");
    S.recurring.forEach(r=>{const a=recAmount(r,m);if(!a)return;
      const mine=r.kind==="transfer"?(!B||bankOf(r)===B||toOf(r)===B):inB(r);
      if(!inWin(r.id,r.day,r.label,mine&&r.kind!=="transfer"?(r.kind==="in"?a:-a):0))return;

function forecastChart(){
  const ks=[...Array(6)].map((_,i)=>addM(CUR,i)), vals=ks.map(k=>startInfo()&&k>=startInfo().k?projBal(k):compute(k).resteEst);
  const W=420,H=190,P={l:52,r:6,t:16,b:24};
  let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn)mx=mn+100;
  const pad=(mx-mn)*0.12; mx+=pad; if(mn<0)mn-=pad;
  const y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b), bw=(W-P.l-P.r)/6;
  const ticks=niceTicks(mn,mx,4);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reste estimé des 6 prochains mois">`;
  ticks.forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t===0?1.5:1}" ${t===0?"":'stroke-dasharray="2 4"'}/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end">${e0(t)}</text>`});
  vals.forEach((v,i)=>{const x=P.l+i*bw+bw*0.2,w=bw*0.6,y0=y(0),yv=y(v);const col=v<0?"var(--bad)":v<num(S.config.cushion)?"var(--warn)":"var(--good)";
    s+=`<rect x="${x}" y="${Math.min(y0,yv)}" width="${w}" height="${Math.max(1,Math.abs(yv-y0))}" rx="4" fill="${col}" ${ks[i]===viewMonth?'':'opacity=".75"'}><title>${monthName(ks[i])} : ${e0(v)}</title></rect>`;
    s+=`<text x="${x+w/2}" y="${v>=0?yv-5:yv+13}" text-anchor="middle" style="fill:var(--ink);font-family:var(--f-num);font-size:11px">${e0(v)}</text>`;
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${monthName(ks[i],true)}</text>`});

function niceTicks(mn,mx,n){const span=mx-mn,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0)||step0;const out=[];for(let t=Math.ceil(mn/st)*st;t<=mx+1e-9;t+=st)out.push((Math.round(t*100)/100)||0);if(!out.includes(0)&&mn<=0&&mx>=0)out.push(0);return out}

  </div>`;
}

/* ---------- Calendrier des prélèvements ---------- */
let fixSort="amount", calBank="all", calDays=[];
function grpHtml(key,label,right,inner){return `<details class="grp" data-grp="${key}" ${openGroups.has(key)?"open":""}><summary><span class="glbl">${label}</span><span class="num gtot">${right}</span><span class="chev" aria-hidden="true"></span></summary><div class="glist">${inner}</div></details>`}

function fsorted(L){return fixSort==="day"?[...L].sort((a,b)=>(has(a.day)?num(a.day):99)-(has(b.day)?num(b.day):99)||monthlyEq(b)-monthlyEq(a)):L}

function calLow(k){const {L,dim}=dayItems(k,null);if(!L.length)return null;const days=Array(dim).fill(0);
  L.filter(x=>x.d).forEach(x=>{days[x.d-1]+=x.t==="in"?x.a:-x.a});let run=0,low={v:0,d:null};days.forEach((v,i)=>{run+=v;if(run<low.v)low={v:run,d:i+1}});

function needMonthly(start,once,rate,cap,T,months){let lo=0,hi=T;for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(simulate({start,monthly:mid,once,months,rate,cap:0}).final>=T)hi=mid;else lo=mid}return Math.ceil(hi-1e-6)}

function updateSim(){
  const out=$("#simOut"); if(!out)return;
  const a=S.accounts.find(x=>x.id===sim.acc), start=a?accEst(a):0, cap=a?num(a.cap):0;
  if(sim.rate===undefined||sim.rate===null)sim.rate=a&&has(a.rate)?num(a.rate):1.7;
  const T=has(sim.target)&&num(sim.target)>0?num(sim.target):0;
  let note="",autoM=false,autoV=false;
  const mIn=$("#simMonths"),mH=$("#simMonthsHint"),vIn=$("#simMonthly"),vH=$("#simMonthlyHint");
  if(T){
    if(cap&&T>cap)note=`<div class="banner" style="background:var(--warn-soft)">${esc(a.name)} est plafonné à ${e0(cap)} : ${e0(T)} ne peut pas y être atteint. Choisis « Nouveau placement » ou un autre compte.</div>`;
    else if(start+num(sim.once)>=T)note=`<div class="banner" style="background:var(--good-soft)">Objectif de ${e0(T)} déjà atteint avec le solde actuel (${e0(start+num(sim.once))}).</div>`;
    else if(sim.drive==="months"){
      // durée choisie → versement mensuel calculé
      const n=Math.max(1,Math.min(600,Math.round(num(sim.months)))),v=needMonthly(start,sim.once,sim.rate,cap,T,n);
      autoV=true;sim.monthly=v;if(vIn&&document.activeElement!==vIn)vIn.value=v;
      note=`<div class="banner" style="background:var(--good-soft)">Pour atteindre ${e0(T)} en <b>${n} mois</b> (${monthName(addM(CUR,n))}) : <b>${e0(v)}/mois</b>.</div>`}
    else{
      // versements choisis → durée calculée
      const big=simulate({start,monthly:sim.monthly,once:sim.once,months:600,rate:sim.rate,cap});const n=big.pts.findIndex(v=>v>=T-0.005);
      if(n>0){autoM=true;sim.months=n;if(mIn&&document.activeElement!==mIn)mIn.value=n;const y=Math.floor(n/12),m=n%12;
        note=`<div class="banner" style="background:var(--good-soft)">Objectif de ${e0(T)} atteint en <b>${n} mois</b>${y?` (${y} an${y>1?"s":""}${m?` et ${m} mois`:""})`:""}, soit en ${monthName(addM(CUR,n))}.</div>`}
      else note=`<div class="banner" style="background:var(--warn-soft)">Avec ces versements, ${e0(T)} n'est pas atteint en 50 ans. Augmente le versement mensuel ou fixe une durée.</div>`}
  }
  if(mH)mH.textContent=autoM?"Calculée d'après tes versements. Modifie-la pour calculer le versement mensuel.":"";
  if(vH)vH.textContent=autoV?"Calculé d'après la durée. Modifie-le pour recalculer la durée.":"";
  const months=Math.max(1,Math.min(600,Math.round(num(sim.months))));
  const r=simulate({start,monthly:sim.monthly,once:sim.once,months,rate:sim.rate,cap});
  out.innerHTML=`${note}<div class="stats"><div class="stat"><div class="k">Dans ${months} mois</div><div class="v">${e0(r.final)}</div><div class="s">${monthName(addM(CUR,months))}</div></div><div class="stat"><div class="k">Dont versé par toi</div><div class="v">${e0(r.paid)}</div><div class="s">solde actuel inclus</div></div><div class="stat"><div class="k">Intérêts</div><div class="v">${e0(r.interest)}</div><div class="s">à ${num(sim.rate).toLocaleString("fr-FR")} %/an</div></div></div>
  ${r.capHit!==null?`<div class="banner" style="background:var(--warn-soft)">Plafond atteint ${r.capHit===0?"dès maintenant":"au mois "+r.capHit}. ${e0(r.refused)} ne pourront pas être versés sur ce compte.</div>`:""}
  ${lineChart([{pts:r.pts,col:"var(--accent)"}],months,"Évolution du solde")}`;
  simActions(a,start,T,months);
}
function lineChart(series,months,label,yearsLabels){
  const W=420,H=200,P={l:54,r:8,t:12,b:24};
  const all=series.flatMap(s=>s.pts);let mx=Math.max(...all,1),mn=0;mx*=1.08;
  const n=series[0].pts.length-1||1;
  const x=i=>P.l+i/n*(W-P.l-P.r), y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  niceTicks(mn,mx,4).filter(t=>t<=mx).forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t?'stroke-dasharray="2 4"':""}/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end">${e0(t)}</text>`});
  const lbls=yearsLabels||[0,Math.round(n/2),n].map(i=>({i,t:i===0?"Auj.":monthName(addM(CUR,Math.round(i/n*months)),true)+" "+pm(addM(CUR,Math.round(i/n*months))).y}));
  lbls.forEach(l=>{s+=`<text x="${x(l.i)}" y="${H-8}" text-anchor="${l.i===0?"start":l.i===n?"end":"middle"}">${esc(l.t)}</text>`});
  series.forEach(se=>{const d=se.pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    if(series.length===1)s+=`<path d="${d}L${x(n)},${y(0)}L${x(0)},${y(0)}Z" fill="${se.col}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.col}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(n)}" cy="${y(se.pts[n])}" r="4" fill="${se.col}"/>`});
  return s+"</svg>";
}

  const lbl=[{i:0,t:`${age} ans`},{i:Math.round(years/2),t:`${age+Math.round(years/2)} ans`},{i:years,t:`${age+years} ans`}];
  o.innerHTML=`<div class="stats">${res.map(r=>`<div class="stat"><div class="k" style="display:flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:${r.col}"></i>${r.n}</div><div class="v">${e0(r.final)}</div><div class="s">dont ${e0(start+m*months)} versés</div></div>`).join("")}</div>
  ${lineChart(res.map(r=>({pts:r.pts,col:r.col})),months,"Projection retraite",lbl)}
  ${years>5?`<div class="banner">Attendre 5 ans avant de commencer coûterait environ <b>${e0(res[1].final-late)}</b> dans le scénario prudent.</div>`:""}`;
}

/* ---------- Comptes utilisateurs + chiffrement de bout en bout (version Vercel + Neon) ----------
   Le mot de passe ne quitte jamais l'appareil : on en dérive (PBKDF2) une clé qui protège la « clé de données »,
   et une empreinte d'authentification que le serveur re-hache. Chaque document est chiffré en AES-GCM avant l'envoi. */
const CR=window.crypto&&window.crypto.subtle, TE=new TextEncoder(), TD=new TextDecoder();
const KDF_PW=600000, KDF_REC=100000, VKEY="comptes-foyer-vault", MKEY="comptes-foyer-mode", PLAIN="comptes-foyer";
let DK=null, ACCT=null, authTab="login", newRecovery=null;
function b64e(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pbkdf2(bytes,salt,iter){const k=await CR.importKey("raw",bytes,"PBKDF2",false,["deriveBits"]);return new Uint8Array(await CR.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:TE.encode(salt),iterations:iter},k,256))}
async function deriveKeys(secret,email,iter){
  const master=await pbkdf2(TE.encode(secret),"comptes-foyer:v1:"+email,iter);
  const auth=b64e(await pbkdf2(master,"comptes-foyer:auth",1));
  const wrap=await CR.importKey("raw",master,{name:"AES-GCM"},false,["encrypt","decrypt"]);
  return {auth,wrap}}
async function seal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return {v:1,iv:b64e(iv),ct:b64e(await CR.encrypt({name:"AES-GCM",iv},key,bytes))}}
async function open_(key,box){return new Uint8Array(await CR.decrypt({name:"AES-GCM",iv:b64d(box.iv)},key,b64d(box.ct)))}
const encDoc=async o=>seal(DK,TE.encode(JSON.stringify(o)));
const decDoc=async b=>JSON.parse(TD.decode(await open_(DK,b)));
const importDK=raw=>CR.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
function newRecoveryString(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(24));let s="";r.forEach((x,i)=>{s+=A[x%A.length];if(i%4===3&&i<23)s+="-"});return s}
const normRec=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{4})(?=.)/g,"$1-");
const normEmail=e=>String(e||"").trim().toLowerCase();
/* petit stockage clé/valeur IndexedDB : la clé de données y est gardée non exportable */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("comptes-foyer",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kv(op,k,v){const d=await idb();return new Promise((res,rej)=>{const s=d.transaction("kv",op==="get"?"readonly":"readwrite").objectStore("kv");const q=op==="get"?s.get(k):op==="del"?s.delete(k):s.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

async function loadVault(){try{const v=JSON.parse(localStorage.getItem(VKEY)||"null");if(!v||v.email!==ACCT)return false;const d=JSON.parse(TD.decode(await open_(DK,v.box)));
  S={...S,...d.S,config:{...DEFAULT_CFG,...(d.S.config||{})}};COLLS.forEach(c=>S[c]=S[c]||[]);api.queue=d.queue||[];return true}catch{return false}}

  if(api.busy||!api.queue.length||mode!=="api"||!DK)return;
  api.busy=true;const batch=api.queue.slice(0,300);
  try{const ops=await Promise.all(batch.map(async o=>o.op==="put"?{op:"put",coll:o.coll,id:o.id,data:await encDoc(o.data)}:{op:"del",coll:o.coll,id:o.id}));
    const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ops}),cache:"no-store"});
    if(r.status===401){mode="auth";authTab="login";return}
    if(!r.ok){const j=await r.json().catch(()=>({}));api.error=j.error||("Erreur serveur "+r.status);throw new Error(api.error)}
    api.queue=api.queue.filter(o=>!batch.includes(o));saveQueue();api.online=true;api.error=null;
  }catch(e){if(!api.error)api.online=false}
  finally{api.busy=false;render();if(api.queue.length&&api.online&&!api.error&&mode==="api")setTimeout(flush,50)}
}
async function pull(){
  if(mode!=="api"||!DK)return;
  if(api.queue.length){await flush();if(api.queue.length)return}
  try{const r=await fetch("/api/state",{cache:"no-store"});
    if(r.status===401){mode="auth";authTab="login";render();return}
    if(!r.ok){const j=await r.json().catch(()=>({}));api.error=j.error||("Erreur serveur "+r.status);api.online=true;render();return}
    const {docs=[]}=await r.json();
    const N={config:{...DEFAULT_CFG},recurring:[],ops:[],accounts:[],projects:[],banks:[]};let bad=0;
    for(const d of docs){try{const o=await decDoc(d.data);if(d.coll==="config"){if(d.id==="main")N.config={...DEFAULT_CFG,...o}}else if(N[d.coll])N[d.coll].push({...o,id:d.id})}catch{bad++}}
    if(bad)api.error=`${bad} élément(s) illisible(s) avec ta clé`;
    COLLS.forEach(c=>N[c]=sortColl(c,N[c]));
    const serverEmpty=!docs.length;
    let plain=null;try{plain=JSON.parse(localStorage.getItem(PLAIN)||"null")}catch{}
    if(serverEmpty&&plain&&Array.isArray(plain.recurring)&&(plain.recurring.length||plain.accounts?.length))api.migrate=plain;
    else if(plain&&!serverEmpty){try{localStorage.removeItem(PLAIN);localStorage.removeItem("comptes-foyer-queue")}catch{}}
    S=N;api.online=true;persist();render();
  }catch{api.online=false;render()}
}
async function probeApi(){
  try{const r=await fetch("/api/me",{cache:"no-store"});
    if(r.status===200){const j=await r.json().catch(()=>({}));return {s:"ok",email:j.email}}
    if(r.status===401)return {s:"login"};if(r.status===500)return {s:"error"};return {s:"none"}}
  catch{try{return {s:localStorage.getItem(MKEY)==="api"?"offline":"none"}}catch{return {s:"none"}}}
}

  render();await flush();await pull()}

  try{const k=await deriveKeys(pw,email,KDF_PW);

    const rec=newRecoveryString(),rk=await deriveKeys(rec.replace(/-/g,""),email,KDF_REC);

function sortColl(c,L){
  if(c==="recurring")return L.sort((a,b)=>(a.kind===b.kind?0:a.kind==="in"?-1:1)||monthlyEq(b)-monthlyEq(a));
  if(c==="accounts")return L.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(c==="banks")return L.sort((a,b)=>num(a.order)-num(b.order));
  return L;
}

        let known=false;try{known=localStorage.getItem(MKEY)==="api"}catch{}
        if(pr.s==="error"){mode="api";api.error="configuration du serveur incomplète (voir le README)";if(k){DK=k;ACCT=em;await loadVault()}render();return}
        if(pr.s==="login"){if(k)await wipeLocal();mode="auth";authTab=known?"login":"signup";render();return}
        if(pr.s==="offline"){if(k){DK=k;ACCT=em;await loadVault();mode="api";api.online=false;render();return}mode="auth";authTab="login";render();return}
        if(k&&em===pr.email){DK=k;ACCT=em;await loadVault();mode="api";render();sync();return}
        ACCT=pr.email;mode="unlock";render();return}}
    if(saved&&Array.isArray(saved.recurring)){S={...S,...saved,config:{...DEFAULT_CFG,...(saved.config||{})}};mode="local"}
    else if(inClaude){S=demoData();mode="demo"}
    else mode="local";
    // Mode appareil seul : demander une seule fois que le navigateur ne supprime pas les données
    try{if(mode==="local"&&navigator.storage&&navigator.storage.persisted&&!localStorage.getItem("comptes-foyer-persist-asked")){navigator.storage.persisted().then(ok=>{if(!ok){localStorage.setItem("comptes-foyer-persist-asked","1");navigator.storage.persist()}}).catch(()=>{})}}catch{}
    render();return;
  }
  db=c;
  try{const u=await window.claude.use("user");if(u){const can=await u.can("data.write");if(can===false)readOnly=true}}catch{}
  setTimeout(()=>{if(mode==="loading"){mode="db";render()}},8000);
  const ready=()=>{if(loaded.size>=COLLS.length+1&&mode==="loading"){mode="db"}render()};
  COLLS.forEach(coll=>db.collection(coll).onSnapshot(s=>{S[coll]=sortColl(coll,s.docs.map(d=>({id:d.id,...d.data()})));loaded.add(coll);ready()},err=>{if(err&&err.code==="revoked"){readOnly=true;render()}}));
  db.doc("config/main").onSnapshot(s=>{S.config={...DEFAULT_CFG,...(s.exists?s.data():{})};loaded.add("config");ready()},()=>{});
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const cd=e.target.closest&&e.target.closest("[data-calday]");
  if(cd){const D=calDays[num(cd.dataset.calday)-1],box=document.getElementById("calDetail");if(D&&box){box.hidden=false;box.innerHTML=`<b>Le ${D.d}</b>`+D.items.map(i=>`<div class="cdrow"><span>${esc(i.l)}</span><span class="num ${i.t==="in"?"pos":""}">${i.t==="in"?"+":"−"}${e2(i.a)}</span></div>`).join("")}return}
  const t=e.target.closest("[data-tab],[data-act]"); if(!t)return;
  if(t.dataset.tab){goTab(t.dataset.tab,0);return}
  const a=t.dataset.act; if(a==="close"){if(e.target===t||t.tagName==="BUTTON")closeSheet();return}
  const [k,id]=a.split(":");
  if(k==="prev"){viewMonth=addM(viewMonth,-1);render()} else if(k==="next"){viewMonth=addM(viewMonth,1);render()} else if(k==="today"){viewMonth=CUR;render()}
  else if(k==="tab"){closeSheet();tab=id;render();window.scrollTo({top:0})}
  else if(k==="settings")settingsSheet();
  else if(k==="export")shareBackup();
  else if(k==="bubbledet"){const d=$("#moisdet");if(d){d.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});d.classList.remove("flash");void d.offsetWidth;d.classList.add("flash")}}
  else if(k==="addctx"){if(readOnly){toast("Lecture seule");return}({mois:opSheet,fixes:()=>recSheet(),epargne:()=>accSheet(),avenir:opSheet}[tab]||opSheet)()}
  else if(k==="backup")backupSheet();
  else if(k==="storage")storageSheet();
  else if(k==="authgo"){if(authTab==="recover")authTab="signup";render();document.getElementById("authForms")?.scrollIntoView({behavior:"smooth"});setTimeout(()=>document.querySelector("#authForms input")?.focus({preventScroll:true}),350)}
  else if(k==="bkshare")shareBackup().then(ok=>{if(ok)closeSheet()});
  else if(k==="bkdl")downloadBackup().then(ok=>{if(ok)closeSheet()});
  else if(k==="golocal"){try{localStorage.setItem(MKEY,"local")}catch{}let sv=null;try{sv=JSON.parse(localStorage.getItem(PLAIN)||"null")}catch{}
    S={config:{...DEFAULT_CFG},recurring:[],ops:[],accounts:[],projects:[],banks:[]};if(sv&&Array.isArray(sv.recurring))S={...S,...sv,config:{...DEFAULT_CFG,...(sv.config||{})}};mode="local";render()}
  else if(k==="gosync"){fetch("/api/me",{cache:"no-store"}).then(r=>{if(r.status===404)throw new Error();try{localStorage.removeItem(MKEY)}catch{}persist();closeSheet();mode="auth";authTab="signup";render();toast("Crée un compte : tes données de cet appareil te seront proposées à l'import")}).catch(()=>toast("La synchronisation n'est pas disponible ici (connexion ou serveur)."))}
  else if(k==="todaydet")todaySheet(id);
  else if(k==="sim")simSheet();
  else if(k==="simapply"){const a=S.accounts.find(x=>x.id===sim.acc);if(a){const m=Math.round(num(sim.monthly)*100)/100;put("accounts",a.id,{...strip(a),monthly:m}).then(()=>{toast(`${a.name} : ${e0(m)}/mois`);updateSim()}).catch(x=>toast(x.message))}}
  else if(k==="simopen"){const pre={monthly:Math.round(num(sim.monthly)*100)/100,rate:num(sim.rate),cap:null,balance:has(sim.once)&&num(sim.once)>0?num(sim.once):""};closeSheet();accSheet(null,pre)}
  else if(k==="simproj"){const n=($("#simProjName")?.value||"").trim();if(!n){toast("Donne un nom au projet");$("#simProjName")?.focus();return}
    const a=S.accounts.find(x=>x.id===sim.acc),T=num(sim.target),mo=Math.max(1,Math.round(num(sim.months)));
    put("projects",uid(),{name:n,target:T,deadline:addM(CUR,mo),saved:a?Math.round(accEst(a)):0,account:a?a.id:null}).then(()=>{toast(`Projet « ${n} » créé`);const i=$("#simProjName");if(i)i.value=""}).catch(x=>toast(x.message))}
  else if(k==="cover"){if(readOnly)toast("Lecture seule");else{const [bk,amt]=id.split("|");coverSheet(bk,num(amt))}}
  else if(k==="accmonth"){const x=S.accounts.find(y=>y.id===id);x&&accMonthSheet(x)}
  else if(k==="fsort"){fixSort=id;render()}
  else if(k==="calb"){calBank=id;if($("#layer").innerHTML)calSheet();else render()}
  else if(k==="cal")calSheet();
  else if(k==="budget"){if(readOnly)toast("Lecture seule");else budgetSheet()}
  else if(k==="migrate"){const d=api.migrate;api.migrate=null;if(d){importAll(d).then(()=>{try{localStorage.removeItem(PLAIN)}catch{}toast("Données importées et chiffrées")})}}
  else if(k==="migrateskip"){api.migrate=null;try{localStorage.removeItem(PLAIN)}catch{}render()}
  else if(k==="authtab"){authTab=id;render()}
  else if(k==="reccopy"){const t=newRecovery||"";(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Clé copiée")).catch(()=>{const el=$("#recKey");if(el){const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}toast("Sélectionne et copie la clé")})}
  else if(k==="recsave")saveText("cle-de-secours-comptes-du-foyer.txt",`Comptes du foyer — clé de secours\nCompte : ${ACCT}\nClé : ${newRecovery}\n\nGarde ce fichier en lieu sûr. Il permet de choisir un nouveau mot de passe sans perdre tes données.\n`,"text/plain")
  else if(k==="recdone"){if(!$("#recOk")?.checked){toast("Coche la case une fois la clé mise en lieu sûr");return}newRecovery=null;afterAuth()}
  else if(k==="logout")doLogout();
  else if(k==="account")accountSheet();
  else if(k==="legacy")legacySheet();
  else if(k==="start"){if(readOnly)toast("Lecture seule");else startSheet()}
  else if(k==="merge"){if(readOnly)toast("Lecture seule");else{const [oid,iid]=id.split("|");mergeTransfer(oid,iid).catch(x=>toast(x.message))}}
  else if(k==="addbank"){if(readOnly)toast("Lecture seule");else bankSheet()}
  else if(k==="bank"){const x=S.banks.find(y=>y.id===id);x&&bankSheet(x)}
  else if(readOnly&&["addop","addrec","addacc","addproj"].includes(k))toast("Lecture seule");
  else if(k==="addop")opSheet(); else if(k==="addrec")recSheet(); else if(k==="addacc")accSheet(); else if(k==="addproj")projSheet();
  else if(k==="op"){const o=S.ops.find(x=>x.id===id);o&&opSheet(o)}
  else if(k==="rec"){const r=S.recurring.find(x=>x.id===id);r&&recSheet(r)}
  else if(k==="recmonth"){const r=S.recurring.find(x=>x.id===id);r&&recMonthSheet(r)}
  else if(k==="acc"){const x=S.accounts.find(y=>y.id===id);x&&accSheet(x)}
  else if(k==="proj"){const x=S.projects.find(y=>y.id===id);x&&projSheet(x)}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.grp){d.open?openGroups.add(d.dataset.grp):openGroups.delete(d.dataset.grp)}},true);
/* Navigation au doigt : balayer à gauche / à droite pour changer d'onglet */
const TABS=["mois","fixes","epargne","avenir"];
function goTab(t,dir){if(t===tab)return;tab=t;try{history.replaceState(null,"","#"+tab)}catch{}render();window.scrollTo({top:0});
  if(dir&&!matchMedia("(prefers-reduced-motion: reduce)").matches){try{$("#main").animate([{transform:`translateX(${dir*28}px)`,opacity:.35},{transform:"none",opacity:1}],{duration:200,easing:"ease-out"})}catch{}}}
(()=>{let sx=0,sy=0,t0=0,ok=false;
  document.addEventListener("touchstart",e=>{ok=false;if(e.touches.length!==1||$("#layer").innerHTML||mode==="login")return;const t=e.touches[0],el=e.target;
    if(el.closest&&el.closest("input,select,textarea,#tabbar,.passlist"))return;if(t.clientX<24||t.clientX>window.innerWidth-24)return;
    sx=t.clientX;sy=t.clientY;t0=Date.now();ok=true},{passive:true});
  document.addEventListener("touchend",e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-t0>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
    const j=TABS.indexOf(tab)+(dx<0?1:-1);if(j>=0&&j<TABS.length)goTab(TABS[j],dx<0?1:-1)},{passive:true});
  // iOS : bloque le zoom à deux doigts
  ["gesturestart","gesturechange"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
})();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)closeSheet()});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(["simRate","simMonthly","simOnce","simMonths","simTarget"].includes(id)){sim[{simRate:"rate",simMonthly:"monthly",simOnce:"once",simMonths:"months",simTarget:"target"}[id]]=e.target.value;if(id==="simMonths")sim.drive="months";else if(id==="simMonthly"||id==="simOnce")sim.drive="monthly";updateSim()}
  if(id==="longM"){longMonthly=num(e.target.value);updateLong()}
});
document.addEventListener("change",e=>{if(e.target.id==="impEmpty"){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.recurring))throw new Error();await importAll(d);toast("Données importées")}catch{toast("Ce fichier n'est pas une sauvegarde de l'application.")}};rd.readAsText(file);return}if(e.target.id==="simAcc"){sim.acc=e.target.value;simLoad();if($("#layer").innerHTML)simSheet();else render()}});
document.addEventListener("submit",async e=>{const f=e.target;const af={login:doLogin,signup:doSignup,recover:doRecover,unlock:doUnlock}[f.dataset.form];if(af){e.preventDefault();af(f);return}if(f.dataset.form==="age"){e.preventDefault();const v=num(f.querySelector("#ageIn").value);if(v<14||v>110){toast("Âge invalide");return}try{await putConfig({...S.config,age:v});toast("Âge enregistré")}catch(x){toast(x.message)}}});
boot();
</script>
